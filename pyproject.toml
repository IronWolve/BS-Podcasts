[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bs-podcasts"
version = "0.9.7"
description = "A wide, mobile-inspired desktop podcast player"
requires-python = ">=3.14.7"
dependencies = [
  "PySide6>=6.11.2,<7",
  "python-mpv>=1.0.8,<2",
  "requests>=2.34.2,<3",
  "urllib3>=2.8.0,<3",
  "mutagen>=1.48.1,<2",
]

[project.scripts]
bs-podcasts = "bs_podcasts.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bs_podcasts = ["data/migrations/*.sql", "assets/branding/*.png", "assets/fonts/*.ttf", "assets/fonts/OFL.txt"]
